<!DOCTYPE html>
<html><body>
<script type="module">
  import createVoseCoreModule from '/wasm/vose_core.js';
  
  createVoseCoreModule().then(mod => {
    try {
      console.log("Module loaded");
      
      const outputPath = '/out.wav';
      mod.ccall(
        'execute_render',
        null,
        ['number', 'number', 'string', 'number'],
        [0, 0, outputPath, 0] // 0 notes
      );
      console.log("execute_render SUCCESS");
    } catch(e) {
      console.error("ERROR IN RENDER:", e);
    }
  });
</script>
</body></html>
