<!DOCTYPE html>
<html><body>
<script type="module">
  import createVoseCoreModule from '/wasm/vose_core.js';
  
  createVoseCoreModule().then(mod => {
    try {
      console.log("Module loaded");
      const key = "test";
      const pcm16 = new Int16Array(44100 * 2); // 2 seconds
      const pcmPtr = mod._malloc(pcm16.length * 2);
      mod.HEAPU8.set(new Uint8Array(pcm16.buffer), pcmPtr);
      mod.ccall('load_embedded_resource', null, ['string', 'number', 'number'], [key, pcmPtr, pcm16.length]);
      mod._free(pcmPtr);

      const NOTE_EVENT_SIZE = 44;
      const notesPtr = mod._malloc(NOTE_EVENT_SIZE);
      const pitchCurveHz = new Array(200).fill(440);
      
      const pitchCurvePtr = mod._malloc(pitchCurveHz.length * 8);
      for (let i = 0; i < pitchCurveHz.length; i++) {
        mod.setValue(pitchCurvePtr + i * 8, pitchCurveHz[i], 'double');
      }
      
      const bytes = mod.lengthBytesUTF8(key) + 1;
      const wavPathPtr = mod._malloc(bytes);
      mod.stringToUTF8(key, wavPathPtr, bytes);
      
      const base = notesPtr;
      mod.setValue(base + 0, wavPathPtr, 'i32');
      mod.setValue(base + 4, pitchCurvePtr, 'i32');
      mod.setValue(base + 8, pitchCurveHz.length, 'i32');
      mod.setValue(base + 12, 0, 'i32');
      mod.setValue(base + 16, 0, 'i32');
      mod.setValue(base + 20, 0, 'i32');
      mod.setValue(base + 24, 0, 'i32');
      mod.setValue(base + 28, 0, 'i32');
      mod.setValue(base + 32, 0, 'i32');
      mod.setValue(base + 36, 0, 'i32');
      mod.setValue(base + 40, 0, 'i32');

      const outputPath = '/out.wav';
      mod.ccall(
        'execute_render',
        null,
        ['number', 'number', 'string', 'number'],
        [notesPtr, 1, outputPath, 0]
      );
      console.log("execute_render SUCCESS");
    } catch(e) {
      console.error("ERROR IN RENDER:", e);
    }
  });
</script>
</body></html>
