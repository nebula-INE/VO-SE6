name: Fetch ONNX Model from Google Drive and Commit to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit-onnx-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Git LFS
        run: |
          git lfs install

      - name: Download ONNX model files via Google Drive API
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: |
          set -e
          mkdir -p models/bigvgan

          download_file() {
            FILE_ID="$1"
            OUT_PATH="$2"
            URL="https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&key=${GDRIVE_API_KEY}"
            echo "Downloading ${OUT_PATH} ..."
            HTTP_CODE=$(curl -L -o "${OUT_PATH}" -w "%{http_code}" -s "${URL}")
            if [ "${HTTP_CODE}" != "200" ]; then
              echo "エラー: ${OUT_PATH} のダウンロードに失敗しました (HTTP ${HTTP_CODE})"
              cat "${OUT_PATH}"
              exit 1
            fi
          }

          download_file "1Tvvucl4T0xxDy-8iRwhCncZ5ekZbwR_G" "models/bigvgan/bigvgan_generator.onnx"
          download_file "1d_KU_nJkOzuhv5sGecTOt700nsHwtiLx" "models/bigvgan/bigvgan_generator.onnx.data"

          ls -lh models/bigvgan/

      - name: Validate downloaded files
        run: |
          for f in models/bigvgan/bigvgan_generator.onnx models/bigvgan/bigvgan_generator.onnx.data; do
            if head -c 200 "$f" | grep -qi "<html\|<!DOCTYPE\|<?xml\|\"error\""; then
              echo "エラー: $f がエラーページ/JSONエラーになっています。"
              echo "--- $f の内容(先頭500バイト) ---"
              head -c 500 "$f"
              exit 1
            fi
            FILESIZE=$(stat -c%s "$f")
            echo "$f size: $FILESIZE bytes"
            if [ "$FILESIZE" -lt 10000 ]; then
              echo "エラー: $f のサイズが小さすぎます。"
              cat "$f"
              exit 1
            fi
          done

      - name: Verify ONNX model loads correctly
        run: |
          pip install onnx
          python -c "
          import onnx
          model = onnx.load('models/bigvgan/bigvgan_generator.onnx')
          onnx.checker.check_model(model)
          print('ONNX model is valid.')
          "

      - name: Track large file with Git LFS
        run: |
          git lfs track "models/bigvgan/*.onnx.data"
          git add .gitattributes

      - name: Commit and push model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/bigvgan/bigvgan_generator.onnx
          git add models/bigvgan/bigvgan_generator.onnx.data
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "Add BigVGAN ONNX model files (via Actions)"
            git push
          fi
